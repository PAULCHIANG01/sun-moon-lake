<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

<style>
/* Layout: a single long watercolor scroll. The page IS the posters' paper (#FDF7EC); posters fade into it at their edges.
   The masthead reads like a printed travel booklet: Kai title, text-only section links, underline for the current one.
   Deliberately single-theme: the posters are painted on light paper, so the page stays on that paper in every theme. */
:root{
  --paper:#FDF7EC;          /* sampled from the posters' paper */
  --ink:#173A36;            /* poster title ink, teal-black */
  --muted:#8C765A;          /* warm sepia for small print */
  --rule:#E7D6BA;           /* faint pencil line */
  --tea:#B4561F;            /* black-tea amber, the one accent */
  --lake:#1F6B63; --hs:#D9622B; --hs-fill:rgba(217,98,43,.12);
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tea);outline-offset:3px;border-radius:2px}

/* masthead */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.bar-in{max-width:640px;margin:0 auto;padding-block:12px 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
.brand b{font-size:24px;font-weight:700;letter-spacing:.08em;white-space:nowrap;flex:none}
.brand span{font-size:13px;color:var(--muted);letter-spacing:.12em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
:lang(en) .brand b{letter-spacing:.02em}
.lang{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-size:15px;color:var(--muted);flex:none}
.lang button{color:var(--muted);padding:2px 1px;border-bottom:1.5px solid transparent}
.lang button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--tea)}
nav.toc{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;margin-top:6px;border-bottom:1px solid var(--rule)}
nav.toc::-webkit-scrollbar{display:none}
nav.toc a{flex:none;font-family:var(--f-display);font-size:15px;color:var(--muted);text-decoration:none;padding:6px 0 7px;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.04em}
nav.toc a.on{color:var(--ink);border-bottom-color:var(--tea)}

/* one-line note under the masthead */
.note{max-width:640px;margin:0 auto;padding-block:12px 4px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--muted);line-height:1.7}
.note .k{white-space:nowrap;color:var(--ink);font-weight:500;margin-left:6px;background-image:linear-gradient(var(--c),var(--c));background-size:100% 2px;background-position:0 100%;background-repeat:no-repeat;padding-bottom:1px}
.note .k.map{--c:var(--hs)} .note .k.route{--c:var(--lake)} .note .k.book{--c:var(--tea)}
.note button{color:var(--tea);text-decoration:underline;text-underline-offset:3px;margin-left:8px;font-size:12.5px}

/* posters: full-bleed on phones, edges dissolve into the paper */
.scroll{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:6px 0}
.poster{scroll-margin-top:96px}
.frame{position:relative;aspect-ratio:2/3;width:100%;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 2.2%,#000 97.8%,transparent 100%),linear-gradient(to right,transparent 0,#000 2.5%,#000 97.5%,transparent 100%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 2.2%,#000 97.8%,transparent 100%),linear-gradient(to right,transparent 0,#000 2.5%,#000 97.5%,transparent 100%);mask-composite:intersect}
.frame img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}

/* tap areas */
.hs{position:absolute;display:block;border-radius:8px;-webkit-tap-highlight-color:transparent;transition:background-color .15s ease,box-shadow .15s ease}
.hs.route{--hs:var(--lake);--hs-fill:rgba(31,107,99,.14)}
.hs.ticket{--hs:var(--tea);--hs-fill:rgba(180,86,31,.14)}
.hs:hover,.hs:focus-visible,.show-hs .hs{box-shadow:0 0 0 2px var(--hs) inset;background:var(--hs-fill);outline:none}
.hs:active{background:var(--hs-fill)}
.frame.flash .hs{animation:flash 1.8s ease-in-out 1}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent inset;background:transparent}30%,70%{box-shadow:0 0 0 2px var(--hs) inset;background:var(--hs-fill)}}

footer{max-width:640px;margin:0 auto;padding-block:18px 44px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));text-align:center;font-family:var(--f-display);color:var(--muted);font-size:13px;line-height:1.8}
footer .end{display:block;font-size:20px;letter-spacing:.3em;color:var(--rule);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.frame.flash .hs{animation:none}.hs{transition:none}}
</style>
</head>

  {id:'05_budget',a:'fares',zh:'票價',en:'Fares'}
];
const UI={
 zh:{brand:'日月潭',sub:'兩天一夜・大眾運輸',note:'輕點圖上任何地方，直接開啟',map:'地圖',route:'路線',book:'訂票',show:'標出可點處',hide:'收起標示',
   foot:'資料查詢於 2026 年 11 月 10 日<br>班次、票價與營業時間請以官方公告為準'},
 en:{brand:'Sun Moon Lake',sub:'2 days · by bus & boat',note:'Tap anywhere on a poster to open',map:'maps',route:'routes',book:'booking',show:'show tap areas',hide:'hide',
   foot:'Researched 10 Nov 2026<br>Check official notices for schedules, fares and hours'}
};

let lang='zh', showing=false;
try{const s=localStorage.getItem('sml-lang'); if(s==='zh'||s==='en') lang=s; else if(!(navigator.language||'').toLowerCase().startsWith('zh')) lang='en';}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=p=>lang==='zh'?p.zh:p.en;

function target(key){
  const g=GO[key]; if(!g) return null;
  if(g[0]==='map'){const p=P[g[1]];return {href:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q),kind:'pin',label:nm(p)};}
  if(g[0]==='dir'){const a=P[g[1]],b=P[g[2]];return {href:'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a.q)+'&destination='+encodeURIComponent(b.q)+'&travelmode='+(g[3]||'transit'),kind:'route',label:nm(a)+' → '+nm(b)};}
  const l=L[g[1]];return {href:l.url,kind:'ticket',label:l[lang]};
}

function render(){
  const u=UI[lang],hots=HOT[lang];
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.getElementById('brand').textContent=u.brand;
  document.getElementById('sub').textContent=u.sub;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
  document.getElementById('toc').innerHTML=POSTERS.map(p=>`<a href="#${p.a}">${esc(p[lang])}</a>`).join('');
  document.getElementById('note').innerHTML=`${esc(u.note)}<span class="k map">${esc(u.map)}</span><span class="k route">${esc(u.route)}</span><span class="k book">${esc(u.book)}</span><button type="button" id="eye" aria-pressed="${showing}">${esc(showing?u.hide:u.show)}</button>`;
  document.getElementById('foot').innerHTML=`<span class="end" aria-hidden="true">～</span>${u.foot}`;
  document.getElementById('posters').innerHTML=POSTERS.map((p,pi)=>{
    const boxes=(hots[p.id]||[]).map(([key,x0,y0,x1,y1])=>{const t=target(key); if(!t) return '';
      return `<a class="hs ${t.kind}" href="${esc(t.href)}" target="_blank" rel="noopener" aria-label="${esc(t.label)}" title="${esc(t.label)}" style="left:${(x0/10.24).toFixed(2)}%;top:${(y0/15.36).toFixed(2)}%;width:${((x1-x0)/10.24).toFixed(2)}%;height:${((y1-y0)/15.36).toFixed(2)}%"></a>`;}).join('');
    return `<section class="poster" id="${p.a}" aria-label="${esc(p[lang])}"><div class="frame"><img src="img/${p.id}_${lang}.jpg" alt="${esc(p[lang])}" ${pi?'loading="lazy"':''} width="1024" height="1536">${boxes}</div></section>`;}).join('');
  observe();
}

let io;
function observe(){
  if(io) io.disconnect();
  const seen=new Set(),links=[...document.querySelectorAll('#toc a')];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting) return;
    const id=en.target.id;
    links.forEach(c=>c.classList.toggle('on',c.getAttribute('href')==='#'+id));
    const on=links.find(c=>c.classList.contains('on')); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'});
    if(!reduce && !seen.has(id)){seen.add(id);const f=en.target.querySelector('.frame');f.classList.add('flash');setTimeout(()=>f.classList.remove('flash'),1900);}
  }),{rootMargin:'-100px 0px -45% 0px'});
  document.querySelectorAll('.poster').forEach(s=>io.observe(s));
}

document.addEventListener('click',e=>{
  const l=e.target.closest('.lang button'); if(l){lang=l.dataset.l;try{localStorage.setItem('sml-lang',lang)}catch(err){}render();return;}
  if(e.target.closest('#eye')){showing=!showing;document.body.classList.toggle('show-hs',showing);const b=document.getElementById('eye');b.setAttribute('aria-pressed',String(showing));b.textContent=showing?UI[lang].hide:UI[lang].show;}
});
