<style>
/* Layout: the five Codex posters ARE the page, stacked in one phone-width column; every card on a poster is a direct link: Google Maps place, Google Maps transit route, or the booking site */
:root{
  --paper:#F5EADA; --surface:#FFFAF2; --ink:#1E3B37; --muted:#806C55; --line:#E6D4B8;
  --lake:#1F6B63; --lake-soft:#E3EEE4; --tea:#B4561F; --tea-soft:#F9E3C8; --moss:#5E7A3A; --moss-soft:#EAF0D8;
  --hs:#D9622B; --hs-fill:rgba(217,98,43,.12);
  --wash-a:rgba(249,212,159,.55); --wash-b:rgba(190,214,160,.35); --wash-c:rgba(244,190,170,.25);
  --on-accent:#FFFFFF; --shadow:0 1px 2px rgba(90,60,30,.08),0 12px 30px rgba(120,80,40,.14);
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1E1712; --surface:#2A211A; --ink:#F4E7D3; --muted:#C2AA8B; --line:#43352A;
  --lake:#78C7B8; --lake-soft:#21332D; --tea:#EDA568; --tea-soft:#45301E; --moss:#AFCB8A; --moss-soft:#2C3320;
  --hs:#FF9A5C; --hs-fill:rgba(255,154,92,.16);
  --wash-a:rgba(237,165,104,.12); --wash-b:rgba(120,199,184,.07); --wash-c:rgba(255,154,92,.06);
  --on-accent:#1E1712; --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E1712; --surface:#2A211A; --ink:#F4E7D3; --muted:#C2AA8B; --line:#43352A;
  --lake:#78C7B8; --lake-soft:#21332D; --tea:#EDA568; --tea-soft:#45301E; --moss:#AFCB8A; --moss-soft:#2C3320;
  --hs:#FF9A5C; --hs-fill:rgba(255,154,92,.16);
  --wash-a:rgba(237,165,104,.12); --wash-b:rgba(120,199,184,.07); --wash-c:rgba(255,154,92,.06);
  --on-accent:#1E1712; --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background-color:var(--paper);background-image:radial-gradient(70% 45% at 0% 0%,var(--wash-a),transparent 70%),radial-gradient(60% 40% at 100% 35%,var(--wash-b),transparent 70%),radial-gradient(70% 45% at 10% 100%,var(--wash-c),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tea);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (min-width:420px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px 8px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--tea);color:var(--on-accent)}
.eye{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.eye svg{width:15px;height:15px}
.eye[aria-pressed="true"]{border-color:var(--hs);color:var(--hs)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--ink);font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chips a.on{border-color:var(--tea);color:var(--tea);background:var(--tea-soft)}

.hint{display:flex;gap:10px;align-items:center;margin:14px 0 4px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.hint .tap{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--hs-fill);color:var(--hs)}
.hint .tap svg{width:16px;height:16px}

/* posters */
.posters{display:flex;flex-direction:column;gap:18px;padding-block:12px 8px}
.poster{scroll-margin-top:108px}
.frame{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow),0 0 0 1px var(--line);background:var(--surface);aspect-ratio:2/3;max-width:100%}
.frame img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;border:0;padding:0;margin:0;background:transparent;border-radius:9px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s ease,box-shadow .15s ease}
.hs:hover,.hs:focus-visible{box-shadow:0 0 0 2px var(--hs) inset;background:var(--hs-fill);outline:none}
.hs:active{background:var(--hs-fill)}
.show-hs .hs{box-shadow:0 0 0 2px var(--hs) inset;background:var(--hs-fill)}
.frame.flash .hs{animation:flash 1.8s ease-in-out 1}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent inset;background:transparent}30%,70%{box-shadow:0 0 0 2px var(--hs) inset;background:var(--hs-fill)}}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 2px 0;font-size:12.5px;color:var(--muted)}
.cap b{font-family:var(--f-display);font-size:16px;color:var(--ink);font-weight:700}
footer{padding-block:20px 40px;color:var(--muted);font-size:12px}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.frame.flash .hs{animation:none}.hs{transition:none}}

.hs{display:block;text-decoration:none}
.hs.route{--hs:var(--lake);--hs-fill:color-mix(in srgb,var(--lake) 16%,transparent)}
.hs.ticket{--hs:var(--tea);--hs-fill:color-mix(in srgb,var(--tea) 16%,transparent)}
.hs .bd{display:none!important;position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--hs);color:#fff;opacity:0;transform:scale(.6);transition:opacity .15s ease,transform .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hs .bd svg{width:12px;height:12px}
.hs.ticket .bd{background:var(--tea)}
.hs.route .bd{background:var(--lake)}
.hs:hover .bd,.hs:focus-visible .bd,.show-hs .hs .bd,.frame.flash .hs .bd{opacity:1;transform:none}
.hint .lg{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-weight:600;color:var(--ink);white-space:nowrap}
.hint .lg svg{width:13px;height:13px;color:var(--hs)}
.hint .lg:nth-of-type(2) svg{color:var(--lake)}
.hint .lg.tk svg{color:var(--tea)}
@media (prefers-reduced-motion:reduce){.hs .bd{transition:none}}
</style>
</head>

const UI={
 zh:{brand:'日月潭 兩天一夜',eye:'區塊',hintA:'點圖上的區塊直接開啟',map:'Google 地圖',route:'路線',book:'訂票',foot:'資料查詢於 2026-11-10。班次、票價與營業時間請以官方公告為準；部分店家地址只有單一來源。',areas:'個可點區塊',go:'開啟'},

let lang='zh';
try{const s=localStorage.getItem('sml-lang'); if(s==='zh'||s==='en') lang=s; else if(!(navigator.language||'').toLowerCase().startsWith('zh')) lang='en';}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=p=>lang==='zh'?p.zh:p.en;

function target(key){
  const g=GO[key]; if(!g) return null;
  if(g[0]==='map'){const p=P[g[1]];return {href:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q),icon:'pin',label:nm(p)+' · '+UI[lang].map};}
  if(g[0]==='dir'){const a=P[g[1]],b=P[g[2]];return {href:'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a.q)+'&destination='+encodeURIComponent(b.q)+'&travelmode='+(g[3]||'transit'),icon:'route',label:nm(a)+' → '+nm(b)+' · '+UI[lang].map};}
  const l=L[g[1]];return {href:l.url,icon:'ticket',label:l[lang]};
}

function render(){
  const u=UI[lang],hots=HOT[lang];
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.getElementById('brand').textContent=u.brand;
  document.getElementById('eye-t').textContent=u.eye;
  document.getElementById('hint').innerHTML=`${esc(u.hintA)}：<span class="lg">${ICON.pin}${esc(u.map)}</span><span class="lg">${ICON.route}${esc(u.route)}</span><span class="lg tk">${ICON.ticket}${esc(u.book)}</span>`;
  document.getElementById('foot').textContent=u.foot;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
  document.getElementById('chips').innerHTML=POSTERS.map(p=>`<a href="#${p.a}">${esc(p[lang])}</a>`).join('');
  document.getElementById('posters').innerHTML=POSTERS.map((p,pi)=>{
    const boxes=(hots[p.id]||[]).map(([key,x0,y0,x1,y1])=>{const t=target(key); if(!t) return '';
      return `<a class="hs ${t.icon}" href="${esc(t.href)}" target="_blank" rel="noopener" aria-label="${esc(t.label)}" title="${esc(t.label)}" style="left:${(x0/10.24).toFixed(2)}%;top:${(y0/15.36).toFixed(2)}%;width:${((x1-x0)/10.24).toFixed(2)}%;height:${((y1-y0)/15.36).toFixed(2)}%"><span class="bd">${ICON[t.icon]}</span></a>`;}).join('');
    const n=(hots[p.id]||[]).length;
    return `<section class="poster" id="${p.a}"><div class="frame"><img src="img/${p.id}_${lang}.jpg" alt="${esc(p[lang])}" ${pi?'loading="lazy"':''} width="1024" height="1536">${boxes}</div><div class="cap"><b>${esc(p[lang])}</b><span>${n} ${u.areas}</span></div></section>`;}).join('');
  observe();
}

let io;
function observe(){
  if(io) io.disconnect();
  const seen=new Set(),chips=[...document.querySelectorAll('#chips a')];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting) return;
    const id=en.target.id;
    chips.forEach(c=>c.classList.toggle('on',c.getAttribute('href')==='#'+id));
    if(!reduce && !seen.has(id)){seen.add(id);const f=en.target.querySelector('.frame');f.classList.add('flash');setTimeout(()=>f.classList.remove('flash'),1900);}
  }),{rootMargin:'-110px 0px -45% 0px'});
  document.querySelectorAll('.poster').forEach(s=>io.observe(s));
}

document.addEventListener('click',e=>{
  const l=e.target.closest('.seg button'); if(l){lang=l.dataset.l;try{localStorage.setItem('sml-lang',lang)}catch(err){}render();return;}
  if(e.target.closest('#eye')){const b=document.getElementById('eye'),on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));document.body.classList.toggle('show-hs',on);}
});
